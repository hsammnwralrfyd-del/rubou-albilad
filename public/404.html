<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var segmentCount = 1; // Account for /rubou-albilad/ base path
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '&amp;') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '&amp;') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
